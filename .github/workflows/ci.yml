name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: predictive-maintenance evaluate-synthetic --output /tmp/v0.1_synthetic.json

  scania-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/scania
          key: scania-aps-uci-421-v1
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run Scania APS v0.2 benchmark
        run: |
          predictive-maintenance evaluate-scania \
            --download \
            --data-dir .cache/scania \
            --output /tmp/v0.2_scania_aps.json | tee /tmp/v0.2_scania_aps.log
      - uses: actions/upload-artifact@v4
        with:
          name: v0.2-scania-evidence
          path: /tmp/v0.2_scania_aps.json
          retention-days: 14
